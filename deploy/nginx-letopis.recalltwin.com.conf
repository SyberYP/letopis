# Letopis download page (static files in /var/www/letopis).
# Installed as /etc/nginx/sites-available/letopis.recalltwin.com (+ sites-enabled link);
# certbot --nginx then adds the 443 server and the http -> https redirect.
# Separate file from other sites on the VPS: nothing here touches them.
server {
    listen 80;
    listen [::]:80;
    server_name letopis.recalltwin.com;

    root /var/www/letopis;
    index index.html;
    charset utf-8;
    autoindex off;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # The APK keeps one name across releases: never let a phone install a stale cached copy.
    location ~ \.apk$ {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache" always;
    }
}
