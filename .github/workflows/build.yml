# Letopis: tests and an installable APK on every change.
name: Letopis

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: letopis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Store key, only when the secret exists; otherwise the personal-build key in the repo is used.
      - name: Store signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LETOPIS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LETOPIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LETOPIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LETOPIS_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/store.jks
          {
            echo "storeFile=store.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk letopis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: letopis-apk
          path: letopis.apk
          retention-days: 30

      # One rolling release: open it on the phone (logged in to GitHub) and install the APK.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: letopis-latest
          name: Летопись — последняя сборка
          prerelease: true
          files: letopis.apk
          body: |
            Сборка ${{ github.run_number }} из ветки `${{ github.ref_name }}`, коммит ${{ github.sha }}.
            Установка: скачать `letopis.apk` на телефоне и открыть (разрешить установку из этого источника).
            Обновление ставится поверх, записи сохраняются.
